name: savorsync

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cardapio
      POSTGRES_USER: cardapio
      POSTGRES_PASSWORD: cardapio
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - cardapio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardapio -d cardapio"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://cardapio:cardapio@postgres:5432/cardapio
      JWT_SECRET: desenvolvimento-cardapio-ete-chave-segura
      CORS_ORIGIN: http://localhost:3000,http://192.168.0.210:3000
      TZ: America/Sao_Paulo
      MIGRATIONS_DIR: /app/database/migrations
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:3333
    environment:
      API_URL: http://backend:3333
      TZ: America/Sao_Paulo
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cardapio_postgres_data:
    name: backend_cardapio_postgres_data
